name: Add Articles and land buying guides page
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/articles-page.yml
permissions:
  contents: write
  pages: write
jobs:
  articles:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Add Articles page and site navigation
        run: |
          python3 - <<'PYARTICLES'
          article_css = '.articles-main{padding-bottom:70px}\n.articles-hero{display:grid;grid-template-columns:1.08fr .92fr;gap:65px;align-items:center;padding-top:38px;padding-bottom:56px}\n.articles-crumb{font-size:11px;color:#7a776f;padding-top:25px}\n.articles-crumb a:hover{color:var(--red)}\n.articles-hero h1{font-size:clamp(38px,4.2vw,58px);line-height:1.13;margin:22px 0}\n.articles-hero h1 em{color:var(--red);font-style:normal}\n.articles-hero p{font-size:15px;line-height:1.9;max-width:490px;color:var(--gray);margin:0}\n.articles-visual{margin:0;position:relative;background:#e8e5dc;height:310px;overflow:hidden}\n.articles-visual img{width:100%;height:100%;object-fit:cover;display:block}\n.articles-hero .articles-caption{font-size:9px;color:#83775f;letter-spacing:1.6px;text-transform:uppercase;margin-top:20px}\n.articles-topics{background:var(--cream);border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:45px 0 48px}\n.articles-section-top{display:flex;justify-content:space-between;align-items:flex-start;gap:25px;margin-bottom:27px}\n.articles-section-top h2{font:normal 32px/1.25 Georgia,serif;margin:0 0 12px;letter-spacing:-.4px}\n.articles-section-top p{font-size:13px;line-height:1.8;color:var(--gray);max-width:560px;margin:0}\n.articles-status{border:1px solid #d9cdbb;border-radius:20px;padding:6px 13px;color:#7c6440;font-size:10px;white-space:nowrap;margin-top:5px}\n.article-topic-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px}\n.article-topic{padding:27px 25px 26px;background:#fff;border:1px solid var(--line);display:flex;flex-direction:column;min-height:250px}\n.article-topic small{font-size:9px;color:#8a6a3c;letter-spacing:1.5px;text-transform:uppercase}\n.article-topic h3{font:normal 25px/1.25 Georgia,serif;margin:18px 0 14px;max-width:240px}\n.article-topic p{font-size:13px;color:var(--gray);line-height:1.85;margin:0}\n.article-topic .article-topic-note{font-size:10px;color:#8a8173;border-top:1px solid var(--line);padding-top:14px;margin-top:auto}\n.articles-contact{display:flex;justify-content:space-between;align-items:center;gap:35px;padding-top:45px}\n.articles-contact h2{font:normal 29px/1.25 Georgia,serif;margin:0 0 12px}\n.articles-contact p{font-size:13px;line-height:1.8;color:var(--gray);margin:0;max-width:550px}\n.articles-contact .btn{flex-shrink:0}\n@media(min-width:901px) and (max-width:1100px){#navigation{gap:14px}#navigation>a,#navigation .properties-toggle{font-size:12px}.brand-name{font-size:16px}.brand-name small{letter-spacing:2px}.brand img{width:48px}.header-inner{gap:13px}.header-cta{padding:10px 12px}}\n@media(max-width:900px){.articles-hero{gap:30px;padding-top:25px;padding-bottom:35px}.articles-visual{height:290px}.article-topic-grid{gap:14px}.article-topic{padding:22px 18px}.article-topic h3{font-size:23px}.articles-contact{gap:25px}}\n@media(max-width:640px){.articles-hero{grid-template-columns:1fr;gap:26px}.articles-hero h1{font-size:41px;letter-spacing:-1px}.articles-hero p{font-size:14px}.articles-visual{height:225px}.articles-topics{padding:32px 0}.articles-section-top{display:block;margin-bottom:23px}.articles-status{display:inline-block;margin-top:16px}.articles-section-top h2{font-size:29px}.article-topic-grid{grid-template-columns:1fr;gap:15px}.article-topic{min-height:0;padding:24px}.article-topic h3{max-width:none;margin:12px 0;font-size:26px}.article-topic .article-topic-note{margin-top:20px}.articles-contact{display:block;padding-top:33px}.articles-contact h2{font-size:28px}.articles-contact .btn{width:100%;margin-top:23px}.articles-main{padding-bottom:38px}}\n'
          article_main = '<main id="articles-main" class="articles-main" tabindex="-1">\n  <div class="wrap">\n    <div class="articles-crumb"><a href="index.html">Home</a> / Articles</div>\n    <section class="articles-hero" aria-labelledby="articles-title">\n      <div>\n        <div class="eyebrow">THE DANLO JOURNAL</div>\n        <h1 id="articles-title">Clear guidance for<br>your <em>land journey.</em></h1>\n        <p>A place for practical articles on buying land in Kenya, due diligence, and understanding the steps along the way.</p>\n        <p class="articles-caption">Buying land starts with better questions.</p>\n      </div>\n      <figure class="articles-visual"><img src="assets/landscapes/open-track.webp" alt="A rural track leading across open grassland" width="1400" height="933" decoding="async"></figure>\n    </section>\n  </div>\n  <section class="articles-topics" aria-labelledby="guides-title">\n    <div class="wrap">\n      <div class="articles-section-top">\n        <div><h2 id="guides-title">Our first guides are on the way.</h2><p>We will share articles across these topics to help you prepare for conversations, property visits, and the buying process.</p></div>\n        <span class="articles-status">Articles coming soon</span>\n      </div>\n      <div class="article-topic-grid">\n        <article class="article-topic"><small>01 / The buying process</small><h3>Buying land in Kenya</h3><p>Guides to the stages of a land purchase, from setting your requirements and viewing properties to understanding the next steps.</p><p class="article-topic-note">Planned guide collection</p></article>\n        <article class="article-topic"><small>02 / Before you commit</small><h3>Due diligence</h3><p>Articles about the questions to ask, documents to discuss, and professional checks to consider before proceeding with a property.</p><p class="article-topic-note">Planned guide collection</p></article>\n        <article class="article-topic"><small>03 / Understanding the details</small><h3>Ownership and transfer</h3><p>Clear explanations of common land terms and the documents and stages you may encounter during a purchase.</p><p class="article-topic-note">Planned guide collection</p></article>\n      </div>\n    </div>\n  </section>\n  <section class="wrap articles-contact" aria-labelledby="articles-contact-title">\n    <div><h2 id="articles-contact-title">What would you like to understand?</h2><p>Suggest a guide topic or speak to Danlo about a property you are considering.</p></div>\n    <a class="btn" href="index.html?inquiry=contact#contact">Talk to Danlo <span aria-hidden="true">&#8594;</span></a>\n  </section>\n</main>\n'
          from pathlib import Path
          import re
          root=Path('.')
          for folder in [root/'docs',root/'website/public']:
              base=(folder/'muthwani-road-lukenya-92-acres.html').read_text()
              body=base[base.index('<body'):]
              body,count=re.subn(r'<main\b.*?</main>', lambda m: article_main, body, count=1, flags=re.S)
              assert count==1
              body=body.replace('#property-main','#articles-main')
              # Articles, rather than Properties, is the active section on this page.
              body=re.sub(r'(<button class="properties-toggle"[^>]*?) aria-current="page"',r'\1',body)
              styles=''.join(re.findall(r'<style>.*?</style>',base,re.S))
              description='Articles and upcoming guides on buying land in Kenya, due diligence, ownership, and the property buying process from Danlo Properties Ltd.'
              head='<!doctype html><html lang="en-KE"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Articles and Land Buying Guides | Danlo Properties Ltd</title>'+styles+'<meta name="description" content="'+description+'"><link rel="canonical" href="https://www.danlopropertiesltd.com/articles.html"><meta name="theme-color" content="#b82025"><link rel="icon" href="assets/danlo-logo.png"><meta property="og:type" content="website"><meta property="og:site_name" content="Danlo Properties Ltd"><meta property="og:title" content="Articles and Land Buying Guides | Danlo Properties Ltd"><meta property="og:description" content="'+description+'"><meta property="og:url" content="https://www.danlopropertiesltd.com/articles.html"><meta property="og:image" content="https://www.danlopropertiesltd.com/assets/landscapes/open-track.webp"><link rel="stylesheet" href="assets/properties-menu.css?v=2"><link rel="stylesheet" href="assets/articles.css?v=1"></head>'
              (folder/'articles.html').write_text(head+body)
              (folder/'assets/articles.css').write_text(article_css)
              count=0
              for file in folder.glob('*.html'):
                  html=file.read_text()
                  nav=re.search(r'<nav id="navigation".*?</nav>',html,re.S)
                  assert nav,file
                  content=nav[0]
                  if 'href="articles.html"' not in content:
                      contact=re.search(r'<a href="(?:index.html)?#contact"[^>]*>Contact</a>',content)
                      assert contact,file
                      link='<a href="articles.html"'+(' aria-current="page"' if file.name=='articles.html' else '')+'>Articles</a>'
                      content=content[:contact.start()]+link+content[contact.start():]
                  html=html[:nav.start()]+content+html[nav.end():]
                  # Add Articles to the footer as well.
                  html=html.replace('<li><a href="land.html">Land catalogue</a></li>','<li><a href="land.html">Land catalogue</a></li><li><a href="articles.html">Articles</a></li>') if '<li><a href="articles.html">Articles</a></li>' not in html else html
                  if 'href="assets/articles.css?v=1"' not in html:html=html.replace('</head>','<link rel="stylesheet" href="assets/articles.css?v=1"></head>')
                  file.write_text(html);count+=1
                  assert '<a href="articles.html"' in content
              assert count==16,(folder,count)
              sitemap=folder/'sitemap.xml'
              xml=sitemap.read_text()
              if 'https://www.danlopropertiesltd.com/articles.html' not in xml:
                  xml=xml.replace('</urlset>','<url><loc>https://www.danlopropertiesltd.com/articles.html</loc></url></urlset>')
                  sitemap.write_text(xml)
              print('Articles page and navigation verified across',count,'pages in',folder)
          
          # Keep the existing menu installer compatible with additional website pages.
          workflow=root/'.github/workflows/properties-menu.yml'
          if workflow.exists():
              text=workflow.read_text().replace('assert count==15,(folder,count)','assert count>=15,(folder,count)')
              text=text.replace("if 'href=\"assets/properties-menu.css\"' not in html:","if 'assets/properties-menu.css' not in html:")
              text=text.replace("if 'src=\"assets/properties-menu.js\"' not in html:","if 'assets/properties-menu.js' not in html:")
              workflow.write_text(text)
          print('Existing property listings and category assignments were preserved.')
          PYARTICLES
      - name: Save updated website in GitHub
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs website/public
          if ! git diff --cached --quiet; then
            git commit -m 'Add Articles page for land buying guides and due diligence topics'
            git push
          fi
      - name: Publish GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
