name: Import complete website source
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Verify and unpack complete source
        run: |
          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          import zipfile, json, hashlib
          root = Path('.')
          archive = root / 'website-source.zip'
          assert hashlib.sha256(archive.read_bytes()).hexdigest() == '68a20c8efe7d7c970a5e28e1bffeb7ff28bb8080305c910a369dd049ed7ed9a8'
          manifest = json.loads((root / 'SOURCE_MANIFEST.json').read_text())
          known = {item['path']: item['sha256'] for item in manifest['files']}
          with zipfile.ZipFile(archive) as z:
              assert len(z.infolist()) == manifest['file_count']
              for item in z.infolist():
                  path = PurePosixPath(item.filename)
                  assert not path.is_absolute() and '..' not in path.parts
                  assert item.filename in known
                  assert hashlib.sha256(z.read(item)).hexdigest() == known[item.filename]
              z.extractall(root / 'website')
          print('Verified and unpacked', len(known), 'files')
          PY
      - name: Prepare GitHub-only website
        run: python3 github-pages-build.py
      - name: Commit website and Pages files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add website docs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Import complete website source and GitHub Pages site'
          git push
