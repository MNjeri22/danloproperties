name: Add Properties mega menu
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/properties-menu.yml
permissions:
  contents: write
  pages: write
jobs:
  menu:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Add four property categories across the website
        run: |
          python3 - <<'PYMENU'
          assets = {'properties-menu.css': '.properties-nav{position:static}\n#navigation .properties-toggle{display:flex;align-items:center;gap:7px;min-height:40px;cursor:pointer;color:#474747}\n.properties-toggle svg{width:12px;height:12px;transition:transform .18s}\n.properties-toggle[aria-expanded="true"] svg{transform:rotate(180deg)}\n#navigation .properties-toggle:hover,#navigation .properties-toggle[aria-current],#navigation .properties-toggle[aria-expanded="true"]{color:var(--red)}\n.properties-mega[hidden]{display:none!important}\n.properties-mega{position:absolute;top:100%;left:50%;transform:translateX(-50%);width:min(850px,calc(100vw - 64px));padding:28px 32px 20px;background:var(--cream,#f7f5f1);border:1px solid var(--line);border-top:2px solid var(--red);box-shadow:0 20px 35px #20202012;color:var(--ink);z-index:30}\n.mega-intro{font:600 10px/1.5 Arial,sans-serif;letter-spacing:1.8px;text-transform:uppercase;color:#8b6a3b;margin:0 0 18px}\n.mega-categories{display:grid;grid-template-columns:1fr 1fr;gap:8px 24px;list-style:none;margin:0;padding:0}\n#navigation .mega-category{display:flex;flex-direction:column;gap:7px;padding:18px 20px;border:1px solid transparent;border-left:1px solid #d7d1c6;white-space:normal;min-height:100px;transition:background .18s,border-color .18s}\n.mega-category small{font:400 10px/1.5 Arial,sans-serif;text-transform:uppercase;letter-spacing:1.5px;color:#726c61}\n.mega-category span{font:400 25px/1.25 Georgia,serif;color:#242424}\n#navigation .mega-category:hover,#navigation .mega-category:focus-visible{background:#fff;border-color:#ded8cc;color:var(--red)}\n.mega-category:hover span,.mega-category:focus-visible span{color:var(--red)}\n.mega-footer{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-top:22px;padding-top:16px;border-top:1px solid #ded8cc}\n.mega-footer p{font:12px/1.5 Arial,sans-serif;color:#777166;margin:0}\n#navigation .mega-all{font:600 12px/1.5 Arial,sans-serif;display:inline-flex;gap:18px;align-items:center;color:var(--red);padding:5px 0;white-space:nowrap}\n.category-page{padding:55px 0 75px;min-height:65vh}\n.category-page .category-lead{font-size:16px;color:var(--gray);max-width:620px;line-height:1.9;margin:0 0 28px}\n.category-page .category-actions{display:flex;gap:12px;flex-wrap:wrap;margin:25px 0 44px}\n.category-page .category-other{border-top:1px solid var(--line);padding-top:25px}\n.category-page .category-other h2{font:normal 23px/1.4 Georgia,serif;margin:0 0 17px}\n.category-page .category-links{display:flex;gap:12px 24px;flex-wrap:wrap}\n.category-page .category-links a{font-size:14px;text-decoration:underline;text-underline-offset:5px}\n.category-page .category-links a:hover{color:var(--red)}\n@media(max-width:900px){\n #navigation{max-height:calc(100dvh - 80px);overflow-y:auto;overscroll-behavior:contain}\n #navigation .properties-nav{width:100%}\n #navigation .properties-toggle{width:100%;justify-content:space-between;padding:11px 0;min-height:46px;font-size:15px}\n .properties-mega{position:static;transform:none;width:100%;padding:15px 16px 12px;box-shadow:none;border:1px solid var(--line);border-top:1px solid var(--line);margin:3px 0 10px;border-radius:2px}\n .mega-intro{font-size:9px;margin-bottom:10px}\n .mega-categories{gap:0;grid-template-columns:1fr}\n #navigation .mega-category{min-height:68px;padding:12px 0;border:0;border-bottom:1px solid #e3ded5;gap:4px}\n #navigation .mega-category:hover,#navigation .mega-category:focus-visible{background:transparent;border-color:#d7d1c6}\n .mega-category small{font-size:8px;letter-spacing:1.2px}\n .mega-category span{font-size:21px}\n .mega-footer{margin-top:12px;padding-top:0;border:0}\n .mega-footer p{display:none}\n #navigation .mega-all{min-height:40px;padding:5px 0;font-size:13px}\n .category-page{padding:35px 0 48px}\n .category-page .category-actions{flex-direction:column;margin-bottom:30px}\n .category-page .category-actions a{width:100%}\n}\n@media(max-width:640px){#navigation{max-height:calc(100dvh - 76px)}}\n@media(prefers-reduced-motion:reduce){.properties-toggle svg,#navigation .mega-category{transition:none}}\n', 'properties-menu.js': '(()=>{\n const root=document.querySelector(\'.properties-nav\');\n if(!root)return;\n const trigger=root.querySelector(\'.properties-toggle\'),panel=root.querySelector(\'.properties-mega\');\n const nav=document.getElementById(\'navigation\'),desktop=matchMedia(\'(min-width:901px)\');\n let leaveTimer;\n function setOpen(open,restore=false){clearTimeout(leaveTimer);panel.hidden=!open;trigger.setAttribute(\'aria-expanded\',String(open));if(restore)trigger.focus();}\n trigger.addEventListener(\'click\',()=>setOpen(panel.hidden));\n root.addEventListener(\'focusout\',event=>{if(!root.contains(event.relatedTarget))setOpen(false)});\n root.addEventListener(\'keydown\',event=>{\n  if(event.key===\'Escape\'&&!panel.hidden){event.preventDefault();event.stopPropagation();setOpen(false,true)}\n  if(event.key===\'ArrowDown\'&&event.target===trigger){event.preventDefault();setOpen(true);panel.querySelector(\'a\').focus()}\n });\n document.addEventListener(\'click\',event=>{if(!root.contains(event.target))setOpen(false)});\n panel.querySelectorAll(\'a\').forEach(a=>a.addEventListener(\'click\',()=>setOpen(false)));\n document.querySelector(\'.menu-toggle\')?.addEventListener(\'click\',()=>setOpen(false));\n new MutationObserver(()=>{if(!nav.classList.contains(\'open\')&&!desktop.matches)setOpen(false)}).observe(nav,{attributes:true,attributeFilter:[\'class\']});\n desktop.addEventListener(\'change\',()=>setOpen(false));\n\n const categories={\n  residential:{name:\'Residential land\',tag:\'Build a community\',copy:\'Tell us about your plans for a home or residential development. Share your preferred location, acreage, and budget so we can discuss land options with you.\'},\n  institutional:{name:\'Institutional land\',tag:\'Establish your vision\',copy:\'Looking for land for a school, college, or another institutional project? Tell us your location, acreage, access needs, and budget to start the conversation.\'},\n  commercial:{name:\'Commercial land\',tag:\'Create room to grow\',copy:\'Discuss your commercial land requirements with Danlo. Tell us about the location, size, access, and budget you have in mind for your project.\'},\n  industrial:{name:\'Industrial land\',tag:\'Plan on a larger scale\',copy:\'Share your requirements for an industrial site, including acreage, location, access, and budget. Our team can discuss the available land options with you.\'}\n };\n const params=new URLSearchParams(location.search),key=params.get(\'category\'),category=categories[key];\n if(!category)return;\n const message=document.getElementById(\'inquiry-message\');\n if(message&&params.get(\'inquiry\')===\'requirements\'&&!message.value){message.value=\'I am interested in \'+category.name.toLowerCase()+\'.\\nPreferred location: \\nAcreage: \\nBudget: \\nIntended use: \';}\n const catalogue=document.getElementById(\'catalogue-main\');\n if(!catalogue)return;\n trigger.setAttribute(\'aria-current\',\'page\');\n document.title=category.name+\' | Danlo Properties Ltd\';\n const main=document.createElement(\'main\');main.id=\'category-main\';main.className=\'category-page\';main.tabIndex=-1;\n main.innerHTML=\'<div class="wrap"><div class="catalogue-crumb"><a href="index.html">Home</a> / <a href="land.html">Properties</a> / \'+category.name+\'</div><div class="eyebrow">\'+category.tag+\'</div><h1>\'+category.name+\'</h1><p class="category-lead">\'+category.copy+\'</p><div class="category-actions"><a class="btn" href="index.html?inquiry=requirements&amp;category=\'+key+\'#contact">Discuss Your Requirements <span aria-hidden="true">&#8594;</span></a><a class="btn secondary" href="land.html">View All Land</a></div><section class="category-other"><h2>Explore other property types</h2><div class="category-links">\'+Object.entries(categories).filter(([id])=>id!==key).map(([id,c])=>\'<a href="land.html?category=\'+id+\'">\'+c.name+\'</a>\').join(\'\')+\'</div></section></div>\';\n catalogue.hidden=true;catalogue.before(main);\n const skip=document.querySelector(\'.skip-link\');if(skip)skip.href=\'#category-main\';\n})();\n'}
          from pathlib import Path
          from html import escape
          import re
          
          root=Path('.')
          asset_source=Path('/workspace/shared/danlo-mega-menu')
          categories=[('residential','Build a community','Residential land'),('institutional','Establish your vision','Institutional land'),('commercial','Create room to grow','Commercial land'),('industrial','Plan on a larger scale','Industrial land')]
          cards=''.join(f'<li><a class="mega-category" href="land.html?category={key}"><small>{tag}</small><span>{name}</span></a></li>' for key,tag,name in categories)
          def menu(match):
           current=' aria-current="page"' if 'aria-current' in match[0] else ''
           return f'<div class="properties-nav"><button class="properties-toggle" type="button" aria-expanded="false" aria-controls="properties-mega"{current}>Properties<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" aria-hidden="true"><path d="m2 4 4 4 4-4"/></svg></button><div class="properties-mega" id="properties-mega" hidden><p class="mega-intro">Explore by property type</p><ul class="mega-categories">{cards}</ul><div class="mega-footer"><p>Find land for your next development.</p><a class="mega-all" href="land.html">View All Land <span aria-hidden="true">&#8594;</span></a></div></div></div>'
          for folder in [root/'docs',root/'website/public']:
           for name in ['properties-menu.css','properties-menu.js']:
            (folder/'assets'/name).write_text(assets[name])
           count=0
           for file in folder.glob('*.html'):
            html=file.read_text()
            if 'properties-nav' not in html:
             html,n=re.subn(r'<a href="land.html"(?: aria-current="page")?>Properties</a>',menu,html,count=1)
             assert n==1,file
            if 'href="assets/properties-menu.css"' not in html:html=html.replace('</head>','<link rel="stylesheet" href="assets/properties-menu.css"></head>')
            if 'src="assets/properties-menu.js"' not in html:html=html.replace('</body>','<script src="assets/properties-menu.js"></script></body>')
            assert html.count('id="properties-mega"')==1,file
            assert all(f'land.html?category={key}' in html for key,_,_ in categories)
            file.write_text(html);count+=1
           assert count==15,(folder,count)
           print('Verified four-category navigation across',count,'pages in',folder)
          print('No property category assignments were changed.')
          PYMENU
          node --check docs/assets/properties-menu.js
          node --check website/public/assets/properties-menu.js
      - name: Save website source in GitHub
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs website/public
          if ! git diff --cached --quiet; then
            git commit -m 'Add responsive Properties mega menu with four land categories'
            git push
          fi
      - name: Publish GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
