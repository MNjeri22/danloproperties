name: Add Sold Properties and Client Reviews section
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/sold-properties.yml
permissions:
  contents: write
  pages: write
jobs:
  sold:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Add sold properties section and review layout
        run: |
          python3 - <<'PYSOLD'
          sold_assets = {'sold-properties.css': '.sold-section{padding:68px 0;background:#fff;border-top:1px solid var(--line);scroll-margin-top:120px}\n.sold-heading{display:flex;justify-content:space-between;align-items:flex-end;gap:50px;margin-bottom:36px}\n.sold-heading h2{font:normal 42px/1.16 Georgia,serif;letter-spacing:-.8px;margin:18px 0 0}\n.sold-heading>p{max-width:355px;font-size:14px;color:var(--gray);line-height:1.9;margin:0 0 5px}\n.sold-content{display:grid;grid-template-columns:1.2fr .8fr;gap:32px}\n.sold-subheading{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:15px;min-height:30px}\n.sold-subheading h3{font:normal 24px/1.3 Georgia,serif;margin:0}\n.sold-label{font-size:8px;letter-spacing:1.5px;color:#8b7049;background:#f5f1e9;border:1px solid #e3d9c8;border-radius:20px;padding:5px 10px;white-space:nowrap}\n.sold-empty{min-height:250px;padding:30px;background:var(--cream);border:1px solid var(--line);display:flex;flex-direction:column;align-items:flex-start;justify-content:center}\n.sold-empty svg{width:43px;height:43px;color:#ae8243;margin-bottom:20px}\n.sold-empty h4{font:normal 22px/1.35 Georgia,serif;margin:0 0 12px;max-width:330px}\n.sold-empty p{font-size:13px;color:var(--gray);line-height:1.85;max-width:370px;margin:0}\n.sold-review-empty{background:#fff;position:relative}\n.sold-quote-mark{font:normal 58px/.9 Georgia,serif;color:#bd9b68;display:block;margin-bottom:15px}\n.sold-next{border-top:1px solid var(--line);margin-top:32px;padding-top:22px;display:flex;align-items:center;justify-content:space-between;gap:22px}\n.sold-next p{font-size:13px;color:var(--gray);margin:0}\n.sold-next a{display:inline-flex;align-items:center;gap:25px;color:var(--red);font-size:12px;font-weight:600;min-height:40px}\n.sold-next a:hover{text-decoration:underline;text-underline-offset:5px}\n.sold-property-grid,.sold-reviews{display:grid;gap:18px}\n.sold-property-card{border:1px solid var(--line);background:#fff;overflow:hidden}\n.sold-property-photo{position:relative;aspect-ratio:16/9;background:var(--cream)}\n.sold-property-photo img{width:100%;height:100%;object-fit:cover;display:block}\n.sold-property-badge{position:absolute;top:15px;left:15px;background:#fff;color:var(--red);font-size:10px;font-weight:700;letter-spacing:1.8px;padding:7px 13px;border:1px solid var(--line)}\n.sold-property-copy{padding:23px}\n.sold-property-copy small{color:#8b7049;font-size:9px;letter-spacing:1.5px;text-transform:uppercase}\n.sold-property-copy h4{font:normal 25px/1.3 Georgia,serif;margin:10px 0}\n.sold-property-copy p{font-size:13px;color:var(--gray);margin:0}\n.sold-client-review{margin:0;padding:28px;background:var(--cream);border:1px solid var(--line)}\n.sold-client-review blockquote{font:normal 20px/1.7 Georgia,serif;margin:0 0 20px;overflow-wrap:anywhere}\n.sold-client-review figcaption{font-size:11px;line-height:1.7;color:var(--gray)}\n.sold-client-review strong{display:block;color:var(--ink);font-size:12px}\n#navigation .mega-sold{font:600 12px/1.5 Arial,sans-serif;display:inline-flex;align-items:center;min-height:40px;color:#514b42;padding:5px 0}\n#navigation .mega-sold:hover{color:var(--red);text-decoration:underline;text-underline-offset:4px}\n@media(max-width:900px){.sold-section{padding:45px 0;scroll-margin-top:95px}.sold-heading{gap:30px}.sold-heading h2{font-size:36px}.sold-content{gap:20px}.sold-empty{padding:24px}.mega-footer{flex-wrap:wrap}.mega-footer .mega-sold{width:100%;border-top:1px solid #ded8cc;padding-top:12px!important}}\n@media(max-width:640px){.sold-heading{display:block;margin-bottom:28px}.sold-heading h2{font-size:34px;margin-bottom:20px}.sold-heading>p{font-size:14px}.sold-content{grid-template-columns:1fr;gap:30px}.sold-empty{min-height:220px;padding:27px}.sold-empty h4{font-size:23px}.sold-next{display:block;margin-top:26px;padding-top:20px}.sold-next a{margin-top:8px}.sold-property-copy{padding:21px}}\n', 'sold-properties.js': "(()=>{\n const propertiesHost=document.getElementById('sold-property-grid'),reviewsHost=document.getElementById('sold-reviews');\n if(!propertiesHost||!reviewsHost)return;\n const text=(tag,value,className)=>{const el=document.createElement(tag);el.textContent=String(value);if(className)el.className=className;return el;};\n fetch('assets/sold-properties.json').then(response=>{if(!response.ok)throw new Error('Unavailable');return response.json();}).then(data=>{\n  const properties=Array.isArray(data.properties)?data.properties.filter(p=>p&&p.id&&p.title&&p.location):[];\n  if(properties.length){\n   propertiesHost.replaceChildren();\n   properties.forEach(p=>{\n    const card=document.createElement('article');card.className='sold-property-card';card.id='sold-'+String(p.id).replace(/[^a-z0-9-]/gi,'');\n    if(p.image&&/^assets\\/[a-z0-9_./-]+\\.(webp|jpg|jpeg|png)$/i.test(p.image)){\n     const visual=document.createElement('div');visual.className='sold-property-photo';const image=document.createElement('img');image.src=p.image;image.alt=p.imageAlt||p.title;image.loading='lazy';image.decoding='async';visual.append(image,text('span','SOLD','sold-property-badge'));card.append(visual);\n    }\n    const copy=document.createElement('div');copy.className='sold-property-copy';copy.append(text('small',p.location),text('h4',p.title));\n    if(Number.isFinite(Number(p.acres))&&Number(p.acres)>0)copy.append(text('p',p.acres+' acres · Sold'));\n    else copy.append(text('p','Sold'));\n    card.append(copy);propertiesHost.append(card);\n   });\n  }\n  const reviews=Array.isArray(data.reviews)?data.reviews.filter(r=>r&&r.name&&r.quote&&(!r.propertyId||properties.some(p=>p.id===r.propertyId))):[];\n  if(reviews.length){reviewsHost.replaceChildren();reviews.forEach(r=>{\n   const figure=document.createElement('figure');figure.className='sold-client-review';figure.append(text('blockquote','“'+r.quote+'”'));\n   const caption=document.createElement('figcaption');caption.append(text('strong',r.name));const property=properties.find(p=>p.id===r.propertyId);if(property)caption.append(text('span',property.title));figure.append(caption);reviewsHost.append(figure);\n  });}\n }).catch(()=>{});\n})();\n", 'sold-properties.json': '{"properties":[],"reviews":[]}\n'}
          sold_section = '<section class="sold-section" id="sold-properties" aria-labelledby="sold-section-title">\n  <div class="wrap">\n    <div class="sold-heading"><div><div class="eyebrow">COMPLETED SALES &amp; CLIENT STORIES</div><h2 id="sold-section-title">Sold properties<br>&amp; client reviews.</h2></div><p>A look at land already sold through Danlo, alongside feedback from the people behind each purchase.</p></div>\n    <div class="sold-content">\n      <div class="sold-land-column"><div class="sold-subheading"><h3>Sold land</h3><span class="sold-label">COMPLETED SALES</span></div><div class="sold-property-grid" id="sold-property-grid"><div class="sold-empty"><svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="M6 23 24 8l18 15M12 19v23h24V19M20 42V29h8v13"/><path d="m30 8 4 4 8-8"/></svg><h4>Sold property highlights coming soon.</h4><p>Completed land sales will be featured here, with their location and property details.</p></div></div></div>\n      <div class="sold-review-column"><div class="sold-subheading"><h3>Client experiences</h3></div><div class="sold-reviews" id="sold-reviews"><div class="sold-empty sold-review-empty"><span class="sold-quote-mark" aria-hidden="true">“</span><h4>Client reviews coming soon.</h4><p>Buyer feedback and stories about the experience of working with Danlo will be shared here.</p></div></div></div>\n    </div>\n    <div class="sold-next"><p>Looking for land for your next project?</p><a href="land.html">Explore Available Land <span aria-hidden="true">&#8594;</span></a></div>\n  </div>\n</section>\n'
          from pathlib import Path
          import re
          root=Path('.')
          for folder in [root/'docs',root/'website/public']:
              for name,content in sold_assets.items():
                  file=folder/'assets'/name
                  # Never overwrite genuine sales or reviews when rerunning the installer.
                  if name=='sold-properties.json' and file.exists():continue
                  file.write_text(content)
              home=folder/'index.html';html=home.read_text()
              if 'id="sold-properties"' not in html:
                  marker='<section class="about-danlo"'
                  assert marker in html
                  html=html.replace(marker,sold_section+marker,1)
              if 'src="assets/sold-properties.js?v=1"' not in html:
                  html=html.replace('</body>','<script src="assets/sold-properties.js?v=1"></script></body>')
              home.write_text(html)
              count=0
              for file in folder.glob('*.html'):
                  html=file.read_text()
                  if 'href="assets/sold-properties.css?v=1"' not in html:
                      html=html.replace('</head>','<link rel="stylesheet" href="assets/sold-properties.css?v=1"></head>')
                  anchor='#sold-properties' if file.name=='index.html' else 'index.html#sold-properties'
                  if 'class="mega-sold"' not in html:
                      html,n=re.subn(r'(<div class="mega-footer">)',lambda m:m[1]+f'<a class="mega-sold" href="{anchor}">Sold Properties &amp; Reviews</a>',html,count=1)
                      assert n==1,file
                  footer_link=f'<li><a href="{anchor}">Sold properties &amp; reviews</a></li>'
                  if '>Sold properties &amp; reviews</a></li>' not in html:
                      marker='<li><a href="land.html">Land catalogue</a></li>'
                      assert marker in html,file
                      html=html.replace(marker,marker+footer_link,1)
                  file.write_text(html);count+=1
              assert count>=16,(folder,count)
              assert (folder/'index.html').read_text().count('id="sold-properties"')==1
              print('Sold Properties and Client Reviews section linked across',count,'pages in',folder)
          print('No active listings were marked sold and no sales or testimonials were invented.')
          PYSOLD
          node --check docs/assets/sold-properties.js
          node --check website/public/assets/sold-properties.js
      - name: Save website source in GitHub
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs website/public
          if ! git diff --cached --quiet; then
            git commit -m 'Add Sold Properties and Client Reviews section with data support'
            git push
          fi
      - name: Publish GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
